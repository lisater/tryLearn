<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа по Python</title>
  
  <!-- Заменили cloudflare на unpkg -->
  <link rel="stylesheet" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com">
  
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  
  <!-- Pyodide -->
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .task-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    /* Задаем нормальный размер на случай, если редактор долго грузится */
    textarea#code-editor {
      width: 100%;
      height: 180px;
      font-family: monospace;
      font-size: 15px;
      padding: 10px;
      box-sizing: border-box;
    }
    .CodeMirror {
      height: 200px;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      display: block; /* Чтобы кнопка была под редактором, а не сбоку */
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #94d3a2;
      cursor: not-allowed;
    }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e1e1e;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .status-success { border-left: 6px solid #2ea44f; color: #7ee787; }
    .status-error   { border-left: 6px solid #cf222e; color: #ff7b72; }
  </style>
</head>
<body>

  <div class="task-box">
    <h2>Лабораторная работа №1: Сумма четных чисел</h2>
    <p>Напишите функцию <code>sum_even(numbers)</code>, которая принимает список целых чисел и возвращает сумму только четных элементов.</p>
    <p><strong>Пример:</strong> <code>sum_even()</code> должна вернуть <code>6</code>.</p>
  </div>

  <textarea id="code-editor">def sum_even(numbers):
    # Напишите ваш код здесь
    return 0

print(sum_even())</textarea>

  <button id="run-btn" disabled>Загрузка Python...</button>
  <div id="output" class="output-box">Ожидание инициализации среды...</div>

  <script>
    const runBtn = document.getElementById("run-btn");
    const outputDiv = document.getElementById("output");
    let editor = null;

    // Безопасно подключаем CodeMirror (если заблокирован — останется обычное большое поле)
    if (typeof CodeMirror !== "undefined") {
      editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        mode: "python",
        theme: "dracula",
        lineNumbers: true,
        indentUnit: 4
      });
    } else {
      console.warn("CodeMirror не загрузился, используем обычное текстовое поле.");
    }

    let pyodide = null;

    async function initPython() {
      // Проверяем, скачался ли скрипт Pyodide
      if (typeof loadPyodide === "undefined") {
        outputDiv.classList.add("status-error");
        outputDiv.textContent = "❌ Не удалось загрузить Pyodide. Проверьте интернет или откройте страницу через GitHub Pages (а не как локальный файл).";
        return;
      }

      try {
        pyodide = await loadPyodide();
        runBtn.disabled = false;
        runBtn.textContent = "Проверить решение";
        outputDiv.textContent = "Python готов! Напишите решение и нажмите кнопку.";
      } catch (err) {
        outputDiv.classList.add("status-error");
        outputDiv.textContent = "Ошибка запуска Python: " + err;
      }
    }
    initPython();

    runBtn.addEventListener("click", async () => {
      // Берем код либо из красивого редактора, либо из обычного поля
      const userCode = editor ? editor.getValue() : document.getElementById("code-editor").value;
      
      outputDiv.className = "output-box";
      outputDiv.textContent = "Выполняется...";

      const testCode = `
${userCode}

assert sum_even() == 6, "Ошибка на тесте"
assert sum_even() == 0, "Ошибка на тесте без четных чисел"
assert sum_even([]) == 0, "Ошибка на пустом списке []"
assert sum_even([-2, 4, -5]) == 2, "Ошибка на отрицательных числах [-2, 4, -5]"
`;

      try {
        let stdoutBuffer = "";
        pyodide.setStdout({ batched: (str) => { stdoutBuffer += str + "\n"; } });
        await pyodide.runPythonAsync(testCode);

        outputDiv.classList.add("status-success");
        outputDiv.textContent = `Вывод программы:\n${stdoutBuffer || "(ничего не выведено)"}\n\n✅ Да, всё верно! Задание выполнено.`;
      } catch (err) {
        outputDiv.classList.add("status-error");
        outputDiv.textContent = `❌ Есть ошибка. Попробуйте переписать код:\n\n${err}`;
      }
    });
  </script>
</body>
</html>
