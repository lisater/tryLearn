<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа по Python</title>
  
  <!-- Редактор кода CodeMirror -->
  <link rel="stylesheet" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com">
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  
  <!-- Легкий движок Skulpt вместо тяжелого Pyodide -->
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .task-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    textarea#code-editor {
      width: 100%;
      height: 180px;
      font-family: monospace;
      font-size: 15px;
    }
    .CodeMirror {
      height: 200px;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      display: block;
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e1e1e;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .status-success { border-left: 6px solid #2ea44f; color: #7ee787; }
    .status-error   { border-left: 6px solid #cf222e; color: #ff7b72; }
  </style>
</head>
<body>

  <!-- УСЛОВИЕ ЗАДАЧИ -->
  <div class="task-box">
    <h2>Лабораторная работа №1: Сумма четных чисел</h2>
    <p>Напишите функцию <code>sum_even(numbers)</code>, которая принимает список целых чисел и возвращает сумму только четных элементов.</p>
    <p><strong>Пример:</strong> <code>sum_even([1, 2, 3, 4])</code> должна вернуть <code>6</code>.</p>
  </div>

  <!-- РЕДАКТОР КОДА -->
  <textarea id="code-editor">def sum_even(numbers):
    # Напишите ваш код здесь
    return 0

print(sum_even([1, 2, 3, 4]))</textarea>

  <!-- КНОПКА ЗАПУСКА (сразу активна!) -->
  <button id="run-btn">Проверить решение</button>
  <div id="output" class="output-box">Готов к работе! Напишите решение и нажмите кнопку.</div>

  <script>
    const runBtn = document.getElementById("run-btn");
    const outputDiv = document.getElementById("output");
    let editor = null;

    if (typeof CodeMirror !== "undefined") {
      editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        mode: "python",
        theme: "dracula",
        lineNumbers: true,
        indentUnit: 4
      });
    }

    // Функция для загрузки стандартных модулей Skulpt
    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "Файл не найден: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    runBtn.addEventListener("click", () => {
      const userCode = editor ? editor.getValue() : document.getElementById("code-editor").value;
      
      outputDiv.className = "output-box";
      outputDiv.textContent = "Выполняется...";
      let stdoutBuffer = "";

      // Настраиваем перехват print()
      Sk.configure({
        output: (text) => { stdoutBuffer += text; },
        read: builtinRead
      });

      // АВТОТЕСТЫ (меняй под свои задачи)
      const fullCode = `
${userCode}

assert sum_even([1, 2, 3, 4]) == 6, "Ошибка на тесте"
assert sum_even([1, 3, 5]) == 0, "Ошибка на тесте без четных чисел"
assert sum_even([]) == 0, "Ошибка на пустом списке []"
assert sum_even([-2, 4, -5]) == 2, "Ошибка на отрицательных числах [-2, 4, -5]"
`;

      // Запускаем код асинхронно
      Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, fullCode, true);
      }).then(
        () => {
          outputDiv.classList.add("status-success");
          outputDiv.textContent = `Вывод программы:\n${stdoutBuffer || "(ничего не выведено)"}\n\n✅ Да, всё верно! Задание выполнено.`;
        },
        (err) => {
          outputDiv.classList.add("status-error");
          outputDiv.textContent = `❌ Есть ошибка. Попробуйте переписать код:\n\n${err.toString()}`;
        }
      );
    });
  </script>
</body>
</html>
