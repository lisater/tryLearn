<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа по Python</title>
  
  <!-- Подключаем Skulpt прямо из твоего репозитория (никаких внешних CDN!) -->
  <script src="skulpt.min.js"></script>
  <script src="skulpt-stdlib.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .task-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    /* Стилизуем обычное поле ввода под красивый темный редактор кода */
    textarea#code-editor {
      width: 100%;
      height: 210px;
      background-color: #282a36;
      color: #f8f8f2;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.5;
      padding: 15px;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      tab-size: 4;
    }
    button {
      display: block;
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c974b;
    }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e1e1e;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .status-success { border-left: 6px solid #2ea44f; color: #7ee787; }
    .status-error   { border-left: 6px solid #cf222e; color: #ff7b72; }
  </style>
</head>
<body>

  <!-- УСЛОВИЕ ЗАДАЧИ -->
  <div class="task-box">
    <h2>Лабораторная работа №1: Сумма четных чисел</h2>
    <p>Напишите функцию <code>sum_even(numbers)</code>, которая принимает список целых чисел и возвращает сумму только четных элементов.</p>
    <p><strong>Пример:</strong> <code>sum_even()</code> должна вернуть <code>6</code>.</p>
  </div>

  <!-- РЕДАКТОР КОДА -->
  <textarea id="code-editor" spellcheck="false">def sum_even(numbers):
    # Напишите ваш код здесь
    return 0

print(sum_even())</textarea>

  <button id="run-btn">Проверить решение</button>
  <div id="output" class="output-box">Готов к работе! Напишите решение и нажмите кнопку.</div>

  <script>
    const editor = document.getElementById("code-editor");
    const runBtn = document.getElementById("run-btn");
    const outputDiv = document.getElementById("output");

    // Делаем так, чтобы клавиша Tab ставила 4 пробела вместо перехода на кнопку
    editor.addEventListener("keydown", function(e) {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
      }
    });

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "Файл не найден: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    runBtn.addEventListener("click", () => {
      // Проверяем, загрузились ли локальные файлы Skulpt из репозитория
      if (typeof Sk === "undefined") {
        outputDiv.className = "output-box status-error";
        outputDiv.textContent = "❌ Файлы skulpt.min.js и skulpt-stdlib.js не найдены в репозитории рядом с index.html.";
        return;
      }

      const userCode = editor.value;
      outputDiv.className = "output-box";
      outputDiv.textContent = "Выполняется...";
      let stdoutBuffer = "";

      Sk.configure({
        output: (text) => { stdoutBuffer += text; },
        read: builtinRead
      });

      // АВТОТЕСТЫ
      const fullCode = `
${userCode}

assert sum_even(list((1, 2, 3, 4))) == 6, "Ошибка на тесте (1, 2, 3, 4)"
assert sum_even(list((1, 3, 5))) == 0, "Ошибка на тесте без четных чисел"
assert sum_even(list()) == 0, "Ошибка на пустом списке"
assert sum_even(list((-2, 4, -5))) == 2, "Ошибка на отрицательных числах"
`;
      Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, fullCode, true);
      }).then(
        () => {
          outputDiv.classList.add("status-success");
          outputDiv.textContent = `Вывод программы:\n${stdoutBuffer || "(ничего не выведено)"}\n\n✅ Да, всё верно! Задание выполнено.`;
        },
        (err) => {
          outputDiv.classList.add("status-error");
          outputDiv.textContent = `❌ Есть ошибка. Попробуйте переписать код:\n\n${err.toString()}`;
        }
      );
    });
  </script>
</body>
</html>
