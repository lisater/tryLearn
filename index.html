<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа по Python</title>
  
  <!-- интерпретатор python, специализированный под js -->
  <script src="skulpt.min.js"></script>

  <!-- стандартные библиотеки python под наш интерпретатор -->
  <script src="skulpt-stdlib.js"></script>

  <!-- модуль для "красивой подсветки" и удобного редактора кода -->
  <script src="ace.js"></script>

  <!-- специальные правила "подсветки" конкретно под python -->
  <script src="mode-python.js"></script>

  <!-- тёмная тема) -->
  <script src="theme-dracula.js"></script>

  <!-- подсказки и автодополнение кода -->
  <script src="ext-language_tools.js"></script>


  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #DCD6F7;
      color: #070a39;
    }
    .task-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(60, 4, 68, 0.5);
      margin-bottom: 20px;
    }

    #editor {
      width: 100%;
      height: 270px;
      border-radius: 8px;
      box-shadow: 0 4px 10px  rgba(60, 4, 68, 0.5);
      line-height: 1.6;
    }
    button {
      padding: 15px 24px;
      font-size: 18px;
      font-weight: 600; 
      background-color: #2ee6c1;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: block;
      margin: 25px auto; 
    }
    button:hover {
      background-color: #18a98c;
    }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #212738;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .status-success { border-left: 6px solid #277a4b; color: #04F06A; }
    .status-error   { border-left: 6px solid #be5054; color: #EF767A; }

    code {
    background-color: #dedde5;
    padding: 2px 6px;
    font-size: 1em;
    }
  </style>
</head>
<body>

  <!-- ниже располагается условие задачи, которое на странице отображается в белом блоке -->
  <div class="task-box">
    <h2>Задание по паттерну "Хранитель"</h2>
    <p>Напишите <code>здесь будет то что надо написать</code> чтобы всё получилось.</p>
    <p><strong>Пример:</strong> <code>то что вы написали</code> должно сделать <code>вот это</code>.</p>
  </div>


  <!-- здесь окошко редактора. Ниже написано что отображается "по умолчанию" -->
  <div id="editor">
    # Напишите ваш код здесь
</div>


  <!-- кнопочка запуска -->
  <button id="run-btn">Проверить решение</button>

  <!-- а это "вывод" кода внизу экрана -->
  <div id="output" class="output-box">Напишите своё решение и нажмите кнопку "Проверить решение".
Удачи с задачей :)
  </div>


  <script>
    // настройка редактора ace под python, чтобы всё симпатично подсвечивалось
    ace.require("ace/ext/language_tools");
    const editor = ace.edit("editor");
    editor.setTheme("ace/theme/dracula");        // добавляем тёмную тему
    editor.session.setMode("ace/mode/python");   // указываем что работаем на python
    
    editor.setOptions({
      fontSize: "15px",
      enableBasicAutocompletion: true, // подсказки по Ctrl + Space
      enableLiveAutocompletion: true,  // всплывающие подсказки при вводе
      enableSnippets: true,            // готовые (def, for, if и т.д.)
      showPrintMargin: false,          
      useWorker: false                 
    });

    // добавляем "воздух" по краям внутри редактора
    editor.renderer.setPadding(12);
    editor.renderer.setScrollMargin(12, 12);

    // запуск skulpt (см README в репозитории страницы)
    const runBtn = document.getElementById("run-btn");
    const outputDiv = document.getElementById("output");


    // эта функция "вытаскивает" библиотеки python когда пользователь использует import
    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "Файл не найден: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }


    // здесь происходит подготовка к выдаче ответа после того как пользователь отправил решение
    runBtn.addEventListener("click", () => {
      const userCode = editor.getValue();
      
      outputDiv.className = "output-box";
      outputDiv.textContent = "Выполняется...";
      let stdoutBuffer = "";

      Sk.configure({
        output: (text) => { stdoutBuffer += text; },
        read: builtinRead
      });

      // здесь автотесты! именно при помощи них проверяется правильность решения пользователя. см README в репозитории странички
      const fullCode = `
${userCode}

#assert что-нибудь
`;


      // тут итоговый запуск python в фоновом режиме + реакция на решение пользователя
      Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, fullCode, true);
      }).then(
        () => {
          outputDiv.classList.add("status-success");
          outputDiv.textContent = `Вывод программы:\n${stdoutBuffer || "(ничего не выведено)"}\n\n✅ Всё верно! Вы молодец, решение правильное :)`;
        },
        (err) => {
          outputDiv.classList.add("status-error");
          outputDiv.textContent = `❌ Что-то пошло не так,попробуйте переписать код. Ваша ошибка:\n\n${err.toString()}`;
        }
      );
    });
  </script>
</body>
</html>
