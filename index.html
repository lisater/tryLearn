<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа по Python</title>
  
  <!-- 1. Подключаем стили для редактора кода CodeMirror -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <!-- 2. Подключаем сам редактор CodeMirror и подсветку для Python -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  
  <!-- 3. Подключаем Pyodide (Python в браузере) -->
  <script src="https://jsdelivr.net"></script>

  <style>
    /* Простые стили оформления страницы */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .task-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .CodeMirror {
      height: 200px;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #94d3a2;
      cursor: not-allowed;
    }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e1e1e;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap; /* Сохраняет переносы строк из print() */
    }
    /* Классы для статуса проверки */
    .status-success { border-left: 6px solid #2ea44f; color: #7ee787; }
    .status-error   { border-left: 6px solid #cf222e; color: #ff7b72; }
  </style>
</head>
<body>

  <!-- БЛОК С УСЛОВИЕМ ЗАДАЧИ (Меняй текст здесь) -->
  <div class="task-box">
    <h2>Лабораторная работа №1: Сумма четных чисел</h2>
    <p>Напишите функцию <code>sum_even(numbers)</code>, которая принимает список целых чисел и возвращает сумму только четных элементов.</p>
    <p><strong>Пример:</strong> <code>sum_even([1, 2, 3, 4])</code> должна вернуть <code>6</code>.</p>
  </div>

  <!-- ПОЛЕ ДЛЯ РЕДАКТОРА КОДА (Начальный шаблон для студента) -->
  <textarea id="code-editor">def sum_even(numbers):
    # Напишите ваш код здесь
    return 0

# Можно вызвать функцию для проверки вывода:
print(sum_even([1, 2, 3, 4]))</textarea>

  <!-- КНОПКА ЗАПУСКА -->
  <button id="run-btn" disabled>Загрузка Python...</button>

  <!-- ОКНО ВЫВОДА РЕЗУЛЬТАТА -->
  <div id="output" class="output-box">Ожидание инициализации среды...</div>

  <script>
    // ==========================================
    // 1. НАСТРОЙКА РЕДАКТОРА КОДА
    // ==========================================
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
      mode: "python",
      theme: "dracula",    // Темная тема (можно поменять на "default")
      lineNumbers: true,   // Показывать номера строк
      indentUnit: 4        // Отступ в 4 пробела
    });

    const runBtn = document.getElementById("run-btn");
    const outputDiv = document.getElementById("output");
    let pyodide = null;

    // ==========================================
    // 2. ЗАГРУЗКА PYTHON (PYODIDE) ПРИ ОТКРЫТИИ СТРАНИЦЫ
    // ==========================================
    async function initPython() {
      try {
        pyodide = await loadPyodide();
        runBtn.disabled = false;
        runBtn.textContent = "Проверить решение";
        outputDiv.textContent = "Python готов! Напишите решение и нажмите кнопку.";
      } catch (err) {
        outputDiv.textContent = "Ошибка загрузки Python: " + err;
      }
    }
    initPython();

    // ==========================================
    // 3. ПРОВЕРКА КОДА ПО НАЖАТИЮ КНОПКИ
    // ==========================================
    runBtn.addEventListener("click", async () => {
      const userCode = editor.getValue(); // Берем код, который написал студент
      
      // Сбрасываем оформление блока вывода
      outputDiv.className = "output-box";
      outputDiv.textContent = "Выполняется...";

      // ТЕСТЫ ДЛЯ ПРОВЕРКИ (Меняй эту часть под свои задачи!)
      // Мы дописываем assert-проверки в конец кода студента
      const testCode = `
${userCode}

# --- АВТОТЕСТЫ ---
assert sum_even([1, 2, 3, 4]) == 6, "Ошибка на тесте"
assert sum_even([1, 3, 5]) == 0, "Ошибка на тесте без четных чисел"
assert sum_even([]) == 0, "Ошибка на пустом списке []"
assert sum_even([-2, 4, -5]) == 2, "Ошибка на отрицательных числах [-2, 4, -5]"
`;

      try {
        // Перехватываем всё, что студент выводит через print()
        let stdoutBuffer = "";
        pyodide.setStdout({ batched: (str) => { stdoutBuffer += str + "\n"; } });

        // Запускаем код студента + наши тесты
        await pyodide.runPythonAsync(testCode);

        // Если ни один assert не упал — всё верно!
        outputDiv.classList.add("status-success");
        outputDiv.textContent = `Вывод программы:\n${stdoutBuffer || "(ничего не выведено)"}\n\n✅ Да, всё верно! Задание выполнено.`;
        
      } catch (err) {
        // Если есть синтаксическая ошибка или упал assert — выводим ошибку
        // Редактор остается открытым, студент может сразу править код
        outputDiv.classList.add("status-error");
        outputDiv.textContent = `❌ Есть ошибка. Попробуйте переписать код:\n\n${err}`;
      }
    });
  </script>
</body>
</html>
